<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2e86c1"/></marker>
    <marker id="mb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e67e22"/></marker>
    <marker id="mc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8e44ad"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#666"/></marker>
  </defs>

  <!-- Column titles -->
  <g fill="#666" text-anchor="middle">
    <text x="90" y="22" font-weight="bold">bodies</text>
    <text x="350" y="22" font-weight="bold">kernel 1: last_layer_per_body</text>
    <text x="350" y="38" font-size="11">leaf layer (depth D): sums</text>
    <text x="610" y="22" font-weight="bold">kernel 2: last_layer_per_cell</text>
    <text x="610" y="38" font-size="11">leaf layer (depth D): averages</text>
    <text x="880" y="22" font-weight="bold">kernel 3: reduce_at_layer</text>
    <text x="880" y="38" font-size="11">one launch per layer, D-1 ... 0</text>
  </g>

  <!-- Bodies, one color per thread -->
  <g fill="none" stroke-width="2">
    <rect x="10" y="60" width="160" height="36" rx="5" stroke="#2e86c1"/>
    <rect x="10" y="106" width="160" height="36" rx="5" stroke="#2e86c1"/>
    <rect x="10" y="152" width="160" height="36" rx="5" stroke="#e67e22"/>
    <rect x="10" y="198" width="160" height="36" rx="5" stroke="#e67e22"/>
    <rect x="10" y="244" width="160" height="36" rx="5" stroke="#8e44ad"/>
    <rect x="10" y="290" width="160" height="36" rx="5" stroke="#8e44ad"/>
  </g>
  <g fill="#444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">
    <text x="90" y="83">body 0</text><text x="90" y="129">body 1</text>
    <text x="90" y="175">body 2</text><text x="90" y="221">body 3</text>
    <text x="90" y="267">body 4</text><text x="90" y="313">body 5</text>
  </g>

  <!-- Kernel 1 arrows: atomicAdd into the leaf cell containing the body -->
  <g stroke-width="1.5" fill="none">
    <line x1="170" y1="78" x2="268" y2="80" stroke="#2e86c1" marker-end="url(#ma)"/>
    <line x1="170" y1="124" x2="268" y2="165" stroke="#2e86c1" marker-end="url(#ma)"/>
    <line x1="170" y1="170" x2="268" y2="90" stroke="#e67e22" marker-end="url(#mb)"/>
    <line x1="170" y1="216" x2="268" y2="315" stroke="#e67e22" marker-end="url(#mb)"/>
    <line x1="170" y1="262" x2="268" y2="240" stroke="#8e44ad" marker-end="url(#mc)"/>
    <line x1="170" y1="308" x2="268" y2="100" stroke="#8e44ad" marker-end="url(#mc)"/>
  </g>

  <!-- Leaf cells: sums -->
  <g fill="#2e86c1" fill-opacity="0.12" stroke="#666" stroke-width="1.5">
    <rect x="270" y="60" width="160" height="60"/><rect x="270" y="135" width="160" height="60"/>
    <rect x="270" y="210" width="160" height="60"/><rect x="270" y="285" width="160" height="60"/>
  </g>
  <g fill="#444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">
    <text x="350" y="94">leaf cell 0</text><text x="350" y="169">leaf cell 1</text>
    <text x="350" y="244">leaf cell 2</text><text x="350" y="319">leaf cell 3</text>
  </g>

  <!-- Kernel 2 arrows -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="430" y1="90" x2="528" y2="90" marker-end="url(#mg)"/><line x1="430" y1="165" x2="528" y2="165" marker-end="url(#mg)"/>
    <line x1="430" y1="240" x2="528" y2="240" marker-end="url(#mg)"/><line x1="430" y1="315" x2="528" y2="315" marker-end="url(#mg)"/>
  </g>

  <!-- Leaf cells: averages, thread stripes of kernel 2 -->
  <g fill="#2e86c1" fill-opacity="0.12" stroke="#666" stroke-width="1.5">
    <rect x="530" y="60" width="160" height="60"/><rect x="530" y="135" width="160" height="60"/>
    <rect x="530" y="210" width="160" height="60"/><rect x="530" y="285" width="160" height="60"/>
  </g>
  <g>
    <rect x="530" y="60" width="6" height="60" fill="#2e86c1"/><rect x="530" y="135" width="6" height="60" fill="#e67e22"/>
    <rect x="530" y="210" width="6" height="60" fill="#8e44ad"/><rect x="530" y="285" width="6" height="60" fill="#27ae60"/>
  </g>
  <g fill="#444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">
    <text x="613" y="94">leaf cell 0</text><text x="613" y="169">leaf cell 1</text>
    <text x="613" y="244">leaf cell 2</text><text x="613" y="319">leaf cell 3</text>
  </g>

  <!-- Kernel 3 arrows: 4 children -> parent -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="690" y1="90" x2="798" y2="190" marker-end="url(#mg)"/><line x1="690" y1="165" x2="798" y2="200" marker-end="url(#mg)"/>
    <line x1="690" y1="240" x2="798" y2="210" marker-end="url(#mg)"/><line x1="690" y1="315" x2="798" y2="220" marker-end="url(#mg)"/>
  </g>

  <!-- Parent cell, stacked: one copy per launch (layers D-1 ... 0) -->
  <rect x="816" y="156" width="160" height="60" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="808" y="164" width="160" height="60" fill="none" stroke="#666" stroke-width="1.5"/>

  <rect x="800" y="172" width="160" height="60" fill="#2e86c1" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
  <rect x="800" y="172" width="6" height="60" fill="#2e86c1"/>
  <g fill="#444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">
    <text x="880" y="206">parent cell (layer D-1)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(10 370)" fill="#666">
    <rect x="0" y="0" width="14" height="14" fill="#fff" stroke="#2e86c1" stroke-width="2"/><text x="20" y="12">thread 0</text>
    <rect x="100" y="0" width="14" height="14" fill="#fff" stroke="#e67e22" stroke-width="2"/><text x="120" y="12">thread 1</text>
    <rect x="200" y="0" width="14" height="14" fill="#fff" stroke="#8e44ad" stroke-width="2"/><text x="220" y="12">thread 2</text>
    <rect x="300" y="0" width="14" height="14" fill="#fff" stroke="#27ae60" stroke-width="2"/><text x="320" y="12">thread 3</text>  </g>
</svg>
