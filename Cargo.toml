[package]
name = "nbody-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["dev", "2d"]}
nalgebra = "0.35.0"
ordered-float = "5.3.0"
rand = "0.10.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
cuda = []
